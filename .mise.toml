[tools]
go = "1.27.1"
golangci-lint = "2.13.2"
hk = "1.58.1"
pkl = "0.32.1"

[hooks]
postinstall = "hk install --mise"

# CI（.github/workflows/ci.yml）と共有する検査。まとめて走らせるのは `mise run check`。
[tasks.fmt]
description = "Check gofmt formatting (fix: gofmt -s -w cmd internal)"
run = '''
files=$(gofmt -s -l $(git ls-files '*.go'))
if [ -n "$files" ]; then
  echo "Needs formatting (run: gofmt -s -w cmd internal):"
  echo "$files"
  exit 1
fi
'''

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.tidy]
description = "Check go.mod/go.sum are tidy (fix: go mod tidy)"
run = "go mod tidy -diff"

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.build]
description = "Build finlake into bin/"
run = "go build -o bin/finlake ./cmd/finlake"

[tasks.check]
description = "Run all CI checks"
depends = ["fmt", "vet", "lint", "tidy", "test"]

# 手元のパイプライン。データレイクは .data/ に置く（FINLAKE_LAKE_ROOT で変えられる）。
# マネーフォワードの Cookie は .mise.local.toml の [env] に MONEYFORWARD_COOKIE で置く。
[tasks.ingest]
description = "Ingest the Money Forward ME CSV of a month (usage: mise run ingest -- --month 2026-09)"
run = 'FINLAKE_LAKE_ROOT="${FINLAKE_LAKE_ROOT:-{{config_root}}/.data}" go run ./cmd/finlake ingest'

[tasks.transform]
description = "Transform the raw CSV of a month (usage: mise run transform -- --month 2026-09)"
run = 'FINLAKE_LAKE_ROOT="${FINLAKE_LAKE_ROOT:-{{config_root}}/.data}" go run ./cmd/finlake transform'

[tasks.mcp]
description = "Serve the MCP server on 127.0.0.1:8080 (bearer token: FINLAKE_MCP_TOKENS, default 'local')"
run = 'FINLAKE_LAKE_ROOT="${FINLAKE_LAKE_ROOT:-{{config_root}}/.data}" FINLAKE_MCP_TOKENS="${FINLAKE_MCP_TOKENS:-local}" go run ./cmd/finlake mcp --addr 127.0.0.1:8080'

# 本番の取り込み（README の「取り込み」）。R2 を指すのはこのタスクだけで、ほかは .data/ のまま。
# エンドポイントが空だと DuckDB は AWS の S3 に向かうので、流す前に止める。
[tasks.pull]
description = "Ingest and transform a month into the R2 lake (usage: mise run pull previous)"
usage = 'arg "<month>" help="passed to --month of ingest and transform"'
env = { FINLAKE_LAKE_ROOT = "s3://finlake", FINLAKE_S3_REGION = "auto", FINLAKE_S3_URL_STYLE = "path" }
run = [
  ': "${FINLAKE_S3_ENDPOINT:?set the R2 settings in .mise.local.toml}" "${FINLAKE_S3_ACCESS_KEY_ID:?}" "${FINLAKE_S3_SECRET_ACCESS_KEY:?}"',
  'go run ./cmd/finlake ingest --month "$usage_month"',
  'go run ./cmd/finlake transform --month "$usage_month"',
]
