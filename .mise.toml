[tools]
go = "1.27.1"
golangci-lint = "2.14.0"
hk = "1.58.1"
pkl = "0.32.1"
# 本番の取り込みが R2 の接続情報を Parameter Store から引くのに使う。
awscli = "2.37.10"

# `aws login` が profile を書く先。~/.aws/config を触らずに済ませる（iac と同じ置き方）。
[env]
AWS_CONFIG_FILE = "{{config_root}}/.aws/config"
AWS_REGION = "ap-northeast-1"

[hooks]
postinstall = "hk install --mise"

# CI（.github/workflows/ci.yml）と共有する検査。まとめて走らせるのは `mise run check`。
[tasks.fmt]
description = "Check gofmt formatting (fix: gofmt -s -w cmd internal)"
run = '''
files=$(gofmt -s -l $(git ls-files '*.go'))
if [ -n "$files" ]; then
  echo "Needs formatting (run: gofmt -s -w cmd internal):"
  echo "$files"
  exit 1
fi
'''

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.tidy]
description = "Check go.mod/go.sum are tidy (fix: go mod tidy)"
run = "go mod tidy -diff"

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.build]
description = "Build finlake into bin/"
run = "go build -o bin/finlake ./cmd/finlake"

[tasks.check]
description = "Run all CI checks"
depends = ["fmt", "vet", "lint", "tidy", "test"]

# 手元のパイプライン。データレイクは .data/ に置く（FINLAKE_LAKE_ROOT で変えられる）。
# マネーフォワードの Cookie は .mise.local.toml の [env] に MONEYFORWARD_COOKIE で置く。
[tasks.ingest]
description = "Ingest the Money Forward ME CSV of a month (usage: mise run ingest -- --month 2026-09)"
run = 'FINLAKE_LAKE_ROOT="${FINLAKE_LAKE_ROOT:-{{config_root}}/.data}" go run ./cmd/finlake ingest'

[tasks.backfill]
description = "Ingest and transform past months (usage: mise run backfill -- --since 2024-01)"
run = 'FINLAKE_LAKE_ROOT="${FINLAKE_LAKE_ROOT:-{{config_root}}/.data}" go run ./cmd/finlake backfill'

[tasks.transform]
description = "Transform the raw CSV of a month (usage: mise run transform -- --month 2026-09)"
run = 'FINLAKE_LAKE_ROOT="${FINLAKE_LAKE_ROOT:-{{config_root}}/.data}" go run ./cmd/finlake transform'

[tasks.sync]
description = "Transform every month whose raw CSV is newer than its product (usage: mise run sync [-- --dry-run])"
run = 'FINLAKE_LAKE_ROOT="${FINLAKE_LAKE_ROOT:-{{config_root}}/.data}" go run ./cmd/finlake sync'

[tasks.mcp]
description = "Serve the MCP server on 127.0.0.1:8080 (bearer token: FINLAKE_MCP_TOKENS, default 'local')"
run = 'FINLAKE_LAKE_ROOT="${FINLAKE_LAKE_ROOT:-{{config_root}}/.data}" FINLAKE_MCP_TOKENS="${FINLAKE_MCP_TOKENS:-local}" go run ./cmd/finlake mcp --addr 127.0.0.1:8080'

# 本番の取り込み（README の「取り込み」）。R2 を指すのは pull と pull:backfill だけで、ほかは .data/ のまま。
# R2 の接続情報は手元に置かず、クラスタの sync が使うのと同じ parameter を流すたびに引く（先に
# `aws login`）。持ち主は iac（applications/finlake/externalsecret.yaml）で、書くのも iac のタスク。
# エンドポイントが空だと DuckDB は AWS の S3 に向かうので、引けなければ流さない。
[tasks.r2]
hide = true
description = "Run finlake against the R2 lake with the credentials in Parameter Store"
env = { FINLAKE_LAKE_ROOT = "s3://finlake", FINLAKE_S3_REGION = "auto", FINLAKE_S3_URL_STYLE = "path" }
run = """
set -eu
param() {
  aws ssm get-parameter --name "/cluster-secrets/finlake/finlake-r2-sync/$1" \\
    --with-decryption --query Parameter.Value --output text
}
FINLAKE_S3_ENDPOINT="$(param FINLAKE_S3_ENDPOINT)"
FINLAKE_S3_ACCESS_KEY_ID="$(param FINLAKE_S3_ACCESS_KEY_ID)"
FINLAKE_S3_SECRET_ACCESS_KEY="$(param FINLAKE_S3_SECRET_ACCESS_KEY)"
export FINLAKE_S3_ENDPOINT FINLAKE_S3_ACCESS_KEY_ID FINLAKE_S3_SECRET_ACCESS_KEY
go run ./cmd/finlake "$@"
"""

[tasks.pull]
description = "Ingest and transform a month into the R2 lake (usage: mise run pull previous)"
usage = 'arg "<month>" help="passed to --month of ingest and transform"'
run = [
  'mise run r2 -- ingest --month "$usage_month"',
  'mise run r2 -- transform --month "$usage_month"',
]

[tasks."pull:backfill"]
description = "Ingest and transform past months into the R2 lake (usage: mise run pull:backfill 2024-01)"
usage = 'arg "<since>" help="first month (YYYY-MM); runs up to the previous month"'
run = 'mise run r2 -- backfill --since "$usage_since"'
