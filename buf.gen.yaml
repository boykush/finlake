version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/boykush/finlake/gen
# plugin の版は持ち主に任せる: go.mod の tool。
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: gen
    opt: paths=source_relative
  # API docs で読むための OpenAPI。MCP の tool に合わせて、JSON だけを proto の項目名で出す。
  - local: ["go", "tool", "protoc-gen-connect-openapi"]
    out: gen
    opt:
      - content-types=json
      - with-proto-names
      - with-service-descriptions
      - short-service-tags
