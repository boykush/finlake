version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/boykush/finlake/gen
# plugin の版は持ち主に任せる: go.mod の tool。
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: gen
    opt: paths=source_relative
  # finlake-mcp の TechDocs（mkdocs.yml）。tool の名前・説明・入出力は proto がそのまま持つ。
  - local: ["go", "tool", "protoc-gen-doc"]
    out: docs
    opt: markdown,index.md
