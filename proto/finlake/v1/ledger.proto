syntax = "proto3";

package finlake.v1;

// 家計（マネーフォワード ME の入出金明細）を引く。
// 金額は円。明細の amount は収入が正、支出が負。集計の income / expense はどちらも正の値。
// 振替（transfer）と計算対象外（excluded）は収支に入らない。
// まず取り込み済みの月を見てから、月を指定して他を使う。
service LedgerService {
  // 取り込み済みの月と、月ごとの収入・支出・収支を新しい順に返す
  rpc ListMonths(ListMonthsRequest) returns (ListMonthsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // 対象月の収入・支出・収支と、大項目ごとの内訳を返す
  rpc GetMonthlySummary(GetMonthlySummaryRequest) returns (GetMonthlySummaryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // 対象月（または期間）の明細を日付順に返す。区分・大項目・キーワード（内容とメモの部分一致）で絞り込める
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // 収入か支出の明細を、選んだ切り口でまとめて返す。何をどう分けて比べたいかが決まっているなら、
  // 明細を読んで足し合わせる代わりにこれを使う。
  // 切り口（group_by）に month か date を入れると、その期間ごとの金額を列にした表になり、行ごとに
  // 期間の中央値・最小・最大が付く。入れなければ、期間全体の合計の行だけを返す。
  rpc AggregateTransactions(AggregateTransactionsRequest) returns (AggregateTransactionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message ListMonthsRequest {}

message ListMonthsResponse {
  repeated MonthTotal months = 1;
}

// 月ごとの収支。
message MonthTotal {
  // 対象月（YYYY-MM）
  string month = 1;
  // 収入の合計（円）
  int64 income = 2;
  // 支出の合計（円、正の値）
  int64 expense = 3;
  // 収入 - 支出（円）
  int64 balance = 4;
  // 収支に入る明細の件数
  int64 count = 5;
}

message GetMonthlySummaryRequest {
  // 対象月（YYYY-MM）
  string month = 1;
}

message GetMonthlySummaryResponse {
  // 対象月（YYYY-MM）
  string month = 1;
  // 収入の合計（円）
  int64 income = 2;
  // 支出の合計（円、正の値）
  int64 expense = 3;
  // 収入 - 支出（円）
  int64 balance = 4;
  // 収支に入る明細の件数
  int64 count = 5;
  // 大項目ごとの内訳。金額の大きい順
  repeated CategoryTotal categories = 6;
}

// 大項目ごとの合計。
message CategoryTotal {
  // income か expense
  string kind = 1;
  // 大項目
  string category = 2;
  // 合計（円、正の値）
  int64 amount = 3;
  // 件数
  int64 count = 4;
}

message ListTransactionsRequest {
  // 対象月（YYYY-MM）。from / to と合わせては使えない
  optional string month = 1;
  // income / expense / transfer / excluded のどれか
  optional string kind = 2;
  // 大項目（完全一致）
  optional string category = 3;
  // 内容とメモの部分一致
  optional string keyword = 4;
  // 最大件数（既定 200、上限 1000）
  optional int32 limit = 5;
  // 期間の開始日（YYYY-MM-DD、含む）。month の代わりに to と組で使う
  optional string from = 6;
  // 期間の終了日（YYYY-MM-DD、含む）
  optional string to = 7;
}

message ListTransactionsResponse {
  repeated Transaction transactions = 1;
}

// 明細1件。
message Transaction {
  string id = 1;
  // 日付（YYYY-MM-DD）
  string date = 2;
  // 内容
  optional string description = 3;
  // 金額（円）。収入が正、支出が負
  int64 amount = 4;
  // income / expense / transfer（振替）/ excluded（計算対象外）
  string kind = 5;
  // 大項目
  optional string category = 6;
  // 中項目
  optional string subcategory = 7;
  // 保有金融機関
  optional string account = 8;
  // メモ
  optional string memo = 9;
}

message AggregateTransactionsRequest {
  // 切り口。month / date / category / subcategory / account から選ぶ（month と date は片方だけ）。
  // 例: [month, category] は大項目ごとの月の推移、[category, subcategory] は期間の中項目の内訳
  repeated string group_by = 1;
  // 開始（YYYY-MM か YYYY-MM-DD、含む）。省くと終了から数えて12か月
  optional string from = 2;
  // 終了（YYYY-MM か YYYY-MM-DD、含む）。省くと取り込み済みの最後の月の末日。
  // group_by に month があれば 24 か月まで、date があれば 400 日まで
  optional string to = 3;
  // expense（既定）か income
  optional string kind = 4;
  // 絞り込む大項目（完全一致）。省くとすべて
  repeated string categories = 5;
  // 除く大項目（完全一致）。固定費を外して見るときなど
  repeated string exclude_categories = 6;
  // 絞り込む保有金融機関（完全一致）
  repeated string accounts = 7;
  // 内容とメモの部分一致
  optional string keyword = 8;
  // 返す行の上限（既定 100、上限 500）。合計の大きい順に切り、残りは omitted にまとめる
  optional int32 limit = 9;
}

message AggregateTransactionsResponse {
  // 表の列。group_by に month か date があるときだけ、古い順に。取り込み済みの月の範囲に限る
  repeated string periods = 1;
  // 行。期間の合計の大きい順
  repeated AggregateRow rows = 2;
  // 列ごとの全体の合計（円、正の値）。periods と同じ順。上限で切った行も含む
  repeated int64 period_totals = 3;
  // 期間全体の合計（円）。上限で切った行も含む
  int64 total = 4;
  // 期間全体の件数。上限で切った行も含む
  int64 count = 5;
  // 上限で切った残りの行の数
  int64 omitted_rows = 6;
  // 上限で切った残りの行の合計（円）
  int64 omitted_total = 7;
}

// 切り口の値の組み合わせ1つぶんの集計。group_by に無い切り口は入らない。
message AggregateRow {
  // 大項目。空の明細は「未分類」
  optional string category = 1;
  // 中項目。空の明細は「未分類」
  optional string subcategory = 2;
  // 保有金融機関。空の明細は「未設定」
  optional string account = 3;
  // 列ごとの金額（円、正の値）。periods と同じ順で、明細の無い期間は 0
  repeated int64 amounts = 4;
  // 期間全体の合計（円）
  int64 total = 5;
  // 期間全体の件数
  int64 count = 6;
  // 列ごとの金額の中央値・最小・最大。明細の無い期間も 0 として数える。periods があるときだけ
  optional PeriodStats stats = 7;
}

// 列ごとの金額の散らばり（円）。
message PeriodStats {
  // 中央値。列の数が偶数なら中央の2つの平均（切り捨て）
  int64 median = 1;
  int64 min = 2;
  int64 max = 3;
}
