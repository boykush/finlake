# finlake のイメージ（Go のバイナリと web）を GHCR に push する。デプロイ先（Job / CronJob / Deployment）と
# digest の追従は boykush/infrastructure-as-code が持ち、この repo はイメージを出すところまで。
name: Image

on:
  push:
    branches:
      - main
    paths:
      - "cmd/**"
      - "gen/**"
      - "internal/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".dockerignore"
      - ".mise.toml"
      - ".github/workflows/image.yml"
  pull_request:
    branches:
      - main
    paths:
      - "cmd/**"
      - "gen/**"
      - "internal/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".dockerignore"
      - ".mise.toml"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions: {}

# 走り残った古い run が、古い main を公開しないように。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/boykush/finlake
  WEB_IMAGE: ghcr.io/boykush/finlake-web

jobs:
  image:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # GHCR への push
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve versions
        id: meta
        run: |
          go_version=$(sed -n 's/^go *= *"\(.*\)"$/\1/p' .mise.toml)
          : "${go_version:?go version not found in .mise.toml}"
          {
            echo "go_version=${go_version}"
            echo "tag=${GITHUB_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"

      # DOKS の node は amd64。
      - name: Build
        env:
          GO_VERSION: ${{ steps.meta.outputs.go_version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg "GO_VERSION=${GO_VERSION}" \
            --build-arg "VERSION=${TAG}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${TAG}" \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:main" \
            .

      # 1回目: s3:// のルートで起動し、焼いた httpfs が読めること（読めなければ起動で落ちる）。
      # 2回目: トークンが無ければ 401、あれば tool が応答すること。
      - name: Smoke test
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          trap 'docker rm --force finlake >/dev/null 2>&1 || true' EXIT
          wait_healthy() {
            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then return 0; fi
              sleep 1
            done
            docker logs finlake >&2 || true
            return 1
          }
          mcp() {
            curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/mcp \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
          }

          docker run --rm --detach --name finlake -p 8080:8080 \
            -e FINLAKE_LAKE_ROOT=s3://finlake-smoke-test \
            -e FINLAKE_S3_ENDPOINT=example.invalid \
            "${IMAGE}:${TAG}"
          wait_healthy || { echo "did not start with the s3 root (httpfs)" >&2; exit 1; }

          status=$(mcp)
          [ "$status" = 200 ] || { echo "expected 200 from tools/list, got ${status}" >&2; exit 1; }
          echo "MCP server started with httpfs and answers tools/list"

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # main は最新のビルドを追う側のための可変な参照。<commit> は後からどのビルドかを特定するためのもの。
      - name: Push
        if: github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:main"

  web:
    name: Build web image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # GHCR への push
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve versions
        id: meta
        run: |
          node_version=$(sed -n 's/^node *= *"\(.*\)"$/\1/p' .mise.toml)
          pnpm_version=$(sed -n 's/^pnpm *= *"\(.*\)"$/\1/p' .mise.toml)
          : "${node_version:?node version not found in .mise.toml}"
          : "${pnpm_version:?pnpm version not found in .mise.toml}"
          {
            echo "node_version=${node_version}"
            echo "node_major=${node_version%%.*}"
            echo "pnpm_version=${pnpm_version}"
            echo "tag=${GITHUB_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          NODE_VERSION: ${{ steps.meta.outputs.node_version }}
          NODE_MAJOR: ${{ steps.meta.outputs.node_major }}
          PNPM_VERSION: ${{ steps.meta.outputs.pnpm_version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg "NODE_VERSION=${NODE_VERSION}" \
            --build-arg "NODE_MAJOR=${NODE_MAJOR}" \
            --build-arg "PNPM_VERSION=${PNPM_VERSION}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${TAG}" \
            --tag "${WEB_IMAGE}:${TAG}" \
            --tag "${WEB_IMAGE}:main" \
            web

      # API が無くても起動し、probe に答えること。
      - name: Smoke test
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          trap 'docker rm --force finlake-web >/dev/null 2>&1 || true' EXIT
          docker run --rm --detach --name finlake-web -p 3000:3000 \
            -e FINLAKE_API_URL=http://example.invalid \
            "${WEB_IMAGE}:${TAG}"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs finlake-web >&2 || true
          exit 1

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Push
        if: github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker push "${WEB_IMAGE}:${TAG}"
          docker push "${WEB_IMAGE}:main"
