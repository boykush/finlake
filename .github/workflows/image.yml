# finlake のイメージを GHCR に push する。デプロイ先（Job / CronJob / Deployment）と
# digest の追従は boykush/infrastructure-as-code が持ち、この repo はイメージを出すところまで。
name: Image

on:
  push:
    branches:
      - main
    paths:
      - "cmd/**"
      - "gen/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".dockerignore"
      - ".mise.toml"
      - ".trivyignore.yaml"
      - ".github/workflows/image.yml"
  pull_request:
    branches:
      - main
    paths:
      - "cmd/**"
      - "gen/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".dockerignore"
      - ".mise.toml"
      - ".trivyignore.yaml"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions: {}

# 走り残った古い run が、古い main を公開しないように。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/boykush/finlake

jobs:
  image:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # GHCR への push
      attestations: write # provenance の保存
      id-token: write # provenance の署名
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve versions
        id: meta
        run: |
          go_version=$(sed -n 's/^go *= *"\(.*\)"$/\1/p' .mise.toml)
          : "${go_version:?go version not found in .mise.toml}"
          {
            echo "go_version=${go_version}"
            echo "tag=${GITHUB_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"

      # DOKS の node は amd64。
      - name: Build
        env:
          GO_VERSION: ${{ steps.meta.outputs.go_version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg "GO_VERSION=${GO_VERSION}" \
            --build-arg "VERSION=${TAG}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${TAG}" \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:main" \
            .

      # 1回目: s3:// のルートで起動し、焼いた httpfs が読めること（読めなければ起動で落ちる）。
      # 2回目: トークンが無ければ 401、あれば tool が応答すること。
      - name: Smoke test
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          trap 'docker rm --force finlake >/dev/null 2>&1 || true' EXIT
          wait_healthy() {
            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then return 0; fi
              sleep 1
            done
            docker logs finlake >&2 || true
            return 1
          }
          mcp() {
            curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/mcp \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
          }

          docker run --rm --detach --name finlake -p 8080:8080 \
            -e FINLAKE_LAKE_ROOT=s3://finlake-smoke-test \
            -e FINLAKE_S3_ENDPOINT=example.invalid \
            "${IMAGE}:${TAG}"
          wait_healthy || { echo "did not start with the s3 root (httpfs)" >&2; exit 1; }

          status=$(mcp)
          [ "$status" = 200 ] || { echo "expected 200 from tools/list, got ${status}" >&2; exit 1; }
          echo "MCP server started with httpfs and answers tools/list"

      # hk も入れるのは、.mise.toml の postinstall が hk を呼ぶため。
      - name: Set up trivy
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: hk trivy

      # push の前に見るので、直せる HIGH / CRITICAL を抱えたビルドは GHCR に届かない。
      # --ignore-unfixed は、まだ上げようのないものを外す。
      # 上げようはあっても base image の側がまだ追いついていないものは、.trivyignore.yaml で期限付きで外す。
      - name: Scan image
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: trivy image --no-progress --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore.yaml "${IMAGE}:${TAG}"

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # main は最新のビルドを追う側のための可変な参照。<commit> は後からどのビルドかを特定するためのもの。
      - name: Push
        id: push
        if: github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:main"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:main")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      # この digest をこの workflow がこの commit から作った、という署名付きの言明を
      # GHCR の image の隣に置く。確かめるのは
      # `gh attestation verify oci://ghcr.io/boykush/finlake:main --owner boykush`。
      - name: Attest
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # storage record は organization の repo にしか作れない。
          create-storage-record: false
